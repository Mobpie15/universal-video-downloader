name: Build Android APK & Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.keystore \
            -alias piekey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pievideo123 \
            -keypass pievideo123 \
            -dname "CN=Pie Video Downloader, O=PieTools, C=IN"

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pie-video-downloader-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: build-android

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Setup Electron Wrapper and yt-dlp binary
        run: |
          npm install --save-dev electron electron-builder
          if (!(Test-Path -Path "electron\bin")) { New-Item -ItemType Directory -Path "electron\bin" }
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp.exe" -OutFile "electron\bin\yt-dlp.exe"

      - name: Package Windows Installer (.exe)
        run: npx electron-builder --win --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pietools-universal-downloader-windows
          path: dist-electron/
          if-no-files-found: warn
          retention-days: 30
